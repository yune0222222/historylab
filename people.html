<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>인물 검색 — HistoryLab</title><link rel="stylesheet" href="css/style.css"></head><body>
<div class="wrap"><div class="crumb">🗣 발언과 기록 › 인물 검색</div>
<form id="pf"><input class="qbar" id="q" placeholder="🔍 이름 또는 분야 (예: 오바마, 김연아, 대통령, 과학자)"></form>
<div class="sub" id="interp" style="margin:10px 0"></div>
<div class="chips" id="fchips" style="margin-bottom:14px"></div>
<div class="pgrid" id="res"></div>
<div class="card" style="margin-top:16px"><b>검색·순위 방식</b><div class="muted" style="margin-top:4px">직접 큐레이션한 인물(Wikidata QID 확인)을 이름(한글·영문·별칭) 또는 분야로 검색합니다. 영상이 많은 인물을 먼저 보여 줍니다. 목록에 없는 이름은 Wikidata 공개 API로 프로필만 조회하고 &#39;아카이브 준비 중&#39;으로 표시합니다 — 검증되지 않은 영상은 자동으로 넣지 않습니다. 생몰일은 Wikidata 값이며 값이 여러 개면 모두 표시합니다. 영상 날짜는 YouTube 업로드일입니다.</div></div></div>
